[project]
name = "ibis-mcp"
version = "1.0.0"
description = "Ibis(서지 관리 앱)의 서재를 AI 에이전트가 다루게 하는 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ibis-mcp = "ibis_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ibis_mcp"]
